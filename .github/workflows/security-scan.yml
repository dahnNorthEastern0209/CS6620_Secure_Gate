
name: SecureGate SAST Security Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Semgrep
        run: python3 -m pip install semgrep

      - name: Run SAST security scan
        run: |
          semgrep scan \
            --config .semgrep/shell-injection.yml \
            --error \
            --metrics=off \
            tests/vulnerable_example.py
